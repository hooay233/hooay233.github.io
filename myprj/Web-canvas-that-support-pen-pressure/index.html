<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Canvas - 项目预览</title>
	<style>
		body {
			margin: 0;
			padding: 20px;
			background-color: #f0f0f0;
			font-family: Arial, sans-serif;
		}
		.preview-header {
			background-color: #fff;
			padding: 20px;
			border-radius: 10px;
			margin-bottom: 20px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}
		.preview-header a {
			color: #ee3388;
			text-decoration: none;
			margin-right: 15px;
		}
		.preview-header a:hover {
			text-decoration: underline;
		}
		.preview-container {
			background-color: #fff;
			border-radius: 10px;
			padding: 20px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}
		#previewContent {
			min-height: 600px;
		}
		iframe {
			width: 100%;
			min-height: 600px;
			border: none;
			border-radius: 5px;
		}
	</style>
</head>
<body>
	<div class="preview-header">
		<a href="../index.html">← 返回项目列表</a>
		<span>Web Canvas with Pen Pressure - 项目预览</span>
	</div>
	<div class="preview-container">
		<iframe id="previewFrame"></iframe>
	</div>

	<script>
		// 从GitHub引入项目预览
		// Web Canvas 支持笔压力的网络画布
		document.getElementById('previewFrame').src = 'https://raw.githack.com/hooay233/Web-canvas-that-support-pen-pressure/master/index.html';
	</script>
