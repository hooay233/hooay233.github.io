<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>码氛 (Vibe Codes) - Hooay Chen</title>
	<link rel="stylesheet" href="../style.css">
	<style>
		* {
			margin: 0;
			padding: 0;
		}
		body {
			background-color: #f0f0f0;
			color: #333;
			padding: 20px;
			font-family: Arial, sans-serif;
		}
		a {
			color: #3388ee;
			text-decoration: none;
		}
		a:hover {
			text-decoration: underline;
		}
		.page-wrap {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.headbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background-color: #eee;
			color: #222;
			padding: 10px 20px;
			border-radius: 10px;
			margin-bottom: 20px;
			width: 100%;
			max-width: 500px;
		}
		.headbar a {
			margin-left: 10px;
			color: #3388ee;
			text-decoration: none;
		}
		.headbar a:hover {
			text-decoration: underline;
		}
		.title {
			background-color: #fff;
			border-radius: 10px;
			padding: 40px;
			text-align: center;
			max-width: 500px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			margin-bottom: 20px;
		}
		.title h1 {
			font-size: 28px;
			margin-bottom: 10px;
		}
		.title p {
			color: #666;
			line-height: 1.6;
		}
		.content {
			background-color: #fff;
			border-radius: 10px;
			padding: 20px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}
		.section {
			margin-bottom: 30px;
		}
		.section h2 {
			font-size: 20px;
			color: #3388ee;
			margin-bottom: 15px;
			border-bottom: 2px solid #3388ee;
			padding-bottom: 10px;
		}
		.code-item {
			background-color: #f5f5f5;
			border-left: 4px solid #3388ee;
			padding: 15px;
			margin-bottom: 15px;
			border-radius: 5px;
		}
		.code-item-title {
			font-weight: bold;
			color: #333;
			margin-bottom: 8px;
		}
		.code-item-desc {
			color: #666;
			font-size: 14px;
			margin-bottom: 8px;
		}
		.code-item-code {
			background-color: #2d2d2d;
			color: #f8f8f2;
			padding: 10px;
			border-radius: 3px;
			overflow-x: auto;
			font-family: 'Courier New', monospace;
			font-size: 12px;
		}
		.theme-transition-overlay {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			z-index: 9999;
			pointer-events: none;
			overflow: hidden;
		}
		.theme-transition-overlay .panel {
			position: fixed;
			inset: 0;
			z-index: 9999;
			overflow: hidden;
			pointer-events: none;
			transition: clip-path 0.75s ease;
			clip-path: inset(0 calc(100% - 4px) 0 0);
		}
		.theme-transition-overlay .panel.active {
			clip-path: inset(0 0 0 0);
		}
		.theme-transition-overlay .page-clone {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			pointer-events: none;
			box-sizing: border-box;
		}
		.theme-transition-overlay .scanline {
			position: absolute;
			top: 0;
			right: 0;
			width: 4px;
			height: 100%;
			background: rgba(255,255,255,0.95);
			box-shadow: 0 0 12px rgba(255,255,255,0.5);
			pointer-events: none;
		}
		body.dark-mode {
			background-color: #333;
			color: #eee;
		}
		body.dark-mode .headbar {
			background-color: #555;
			color: #eee;
		}
		body.dark-mode .title,
		body.dark-mode .content {
			background-color: #444;
			color: #eee;
		}
		body.dark-mode .code-item {
			background-color: #555;
			border-left-color: #2277cc;
		}
		body.dark-mode .section h2 {
			color: #2277cc;
			border-bottom-color: #2277cc;
		}
	</style>
</head>
<body>
	<div class="page-wrap">
		<div class="headbar">
			<div>码氛 (Vibe Codes)</div>
			<div>
				<a href="../index.html">← 返回首页</a>
				<button id="dark-mode-switch" onclick="startThemeTransition()" style="background-color: #ccc; color: #222; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;"></button>
			</div>
		</div>
		<div class="title">
			<h1>这里暂时什么也没有哦~ 🥰</h1>
			<p>敬请期待更多有趣的代码片段和编程技巧！</p>
		</div>
	</div>

	<script>
		const pageWrap = document.querySelector('.page-wrap');
		const darkModeSwitch = document.getElementById('dark-mode-switch');

		function setThemeStyles(isDark) {
			document.body.classList.toggle('dark-mode', isDark);
			document.body.style.backgroundColor = isDark ? '#333' : '#f0f0f0';
			document.body.style.color = isDark ? '#eee' : '#333';
			document.querySelector('.headbar').style.backgroundColor = isDark ? '#555' : '#eee';
			document.querySelector('.headbar').style.color = isDark ? '#eee' : '#222';
		}

		function updateSwitchText(isDark) {
			darkModeSwitch.textContent = isDark ? '切换到亮色模式' : '切换到暗色模式';
		}

		function setThemeStylesOnNode(root, isDark) {
			if (root instanceof HTMLElement) {
				root.style.backgroundColor = isDark ? '#333' : '#f0f0f0';
				root.style.color = isDark ? '#eee' : '#333';
			}
			const headbar = root.querySelector('.headbar');
			if (headbar) {
				headbar.style.backgroundColor = isDark ? '#555' : '#eee';
				headbar.style.color = isDark ? '#eee' : '#222';
			}
		}

		function createTransitionOverlay(newIsDark) {
			const overlay = document.createElement('div');
			overlay.className = 'theme-transition-overlay';

			const newPanel = document.createElement('div');
			newPanel.className = 'panel';
			newPanel.style.backgroundColor = newIsDark ? '#333' : '#f0f0f0';

			const scrollX = window.scrollX || window.pageXOffset;
			const scrollY = window.scrollY || window.pageYOffset;

			const cloneWrapper = document.createElement('div');
			cloneWrapper.className = 'page-clone';
			cloneWrapper.style.position = 'absolute';
			cloneWrapper.style.top = `${-scrollY}px`;
			cloneWrapper.style.left = `${-scrollX}px`;
			cloneWrapper.style.padding = getComputedStyle(document.body).padding;
			cloneWrapper.style.width = '100%';
			cloneWrapper.style.height = '100%';
			cloneWrapper.style.boxSizing = 'border-box';

			const clone = pageWrap.cloneNode(true);
			setThemeStylesOnNode(clone, newIsDark);
			cloneWrapper.appendChild(clone);
			newPanel.appendChild(cloneWrapper);

			const scanline = document.createElement('div');
			scanline.className = 'scanline';
			newPanel.appendChild(scanline);

			overlay.appendChild(newPanel);

			return { overlay, newPanel };
		}

		function startThemeTransition() {
			const isDark = document.body.classList.contains('dark-mode');
			const newIsDark = !isDark;
			
			darkModeSwitch.classList.add('spcbtn_disabled');
			darkModeSwitch.onclick = null;
			
			const { overlay, newPanel } = createTransitionOverlay(newIsDark);
			document.body.appendChild(overlay);

			requestAnimationFrame(() => {
				newPanel.classList.add('active');
			});

			newPanel.addEventListener('transitionend', () => {
				setThemeStyles(newIsDark);
				updateSwitchText(newIsDark);
				overlay.remove();
				
				darkModeSwitch.classList.remove('spcbtn_disabled');
				darkModeSwitch.onclick = startThemeTransition;
			}, { once: true });
		}

		setThemeStyles(false);
		updateSwitchText(false);
	</script>
</body>
</html>
