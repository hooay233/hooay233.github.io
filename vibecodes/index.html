<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>码氛 (Vibe Codes) - Hooay Chen</title>
	<link rel="stylesheet" href="../style.css">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<style>
		* {
			margin: 0;
			padding: 0;
		}
		body {
			background-color: #f0f0f0;
			color: #333;
			padding: 20px;
			font-family: Arial, sans-serif;
		}
		a {
			color: #3388ee;
			text-decoration: none;
		}
		a:hover {
			text-decoration: underline;
		}
		.page-wrap {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 20px;
		}
		.headbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background-color: #eee;
			color: #222;
			padding: 10px 20px;
			border-radius: 10px;
			margin-bottom: 20px;
			width: 100%;
			max-width: 700px;
		}
		.headbar a {
			margin-left: 10px;
			color: #3388ee;
			text-decoration: none;
		}
		.headbar a:hover {
			text-decoration: underline;
		}
		.hero-img {
			width: 100%;
			max-width: 700px;
			border-radius: 10px;
			margin-bottom: 20px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			display: block;
		}
		.title {
			background-color: #fff;
			border-radius: 10px;
			padding: 20px;
			max-width: 660px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			margin-bottom: 20px;
			width: 100%;
		}
		.title h1 {
			font-size: 24px;
			margin-bottom: 10px;
		}
		.title p {
			color: #666;
			line-height: 1.6;
		}
		.content {
			background-color: #fff;
			border-radius: 10px;
			padding: 20px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			max-width: 660px;
			width: 100%;
		}
		.project-grid {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}
		.project-card {
			background-color: #f5f5f5;
			border-left: 4px solid #3388ee;
			padding: 15px;
			border-radius: 5px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			transition: background-color 0.2s ease;
		}
		.project-card:hover {
			background-color: #e8e8e8;
		}
		.project-info {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.project-name {
			font-weight: bold;
			color: #333;
			font-size: 15px;
		}
		.project-model {
			color: #888;
			font-size: 13px;
		}
		.project-link {
			color: #3388ee;
			font-size: 13px;
			white-space: nowrap;
		}
		.theme-transition-overlay {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			z-index: 9999;
			pointer-events: none;
			overflow: hidden;
		}
		.theme-transition-overlay .panel {
			position: fixed;
			inset: 0;
			z-index: 9999;
			overflow: hidden;
			pointer-events: none;
			transition: clip-path 0.75s ease;
			clip-path: inset(0 calc(100% - 4px) 0 0);
		}
		.theme-transition-overlay .panel.active {
			clip-path: inset(0 0 0 0);
		}
		.theme-transition-overlay .page-clone {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			pointer-events: none;
			box-sizing: border-box;
		}
		.theme-transition-overlay .scanline {
			position: absolute;
			top: 0;
			right: 0;
			width: 4px;
			height: 100%;
			background: rgba(255,255,255,0.95);
			box-shadow: 0 0 12px rgba(255,255,255,0.5);
			pointer-events: none;
		}
		body.dark-mode {
			background-color: #333;
			color: #eee;
		}
		body.dark-mode .headbar {
			background-color: #555;
			color: #eee;
		}
		body.dark-mode .title,
		body.dark-mode .content {
			background-color: #444;
			color: #eee;
		}
		body.dark-mode .project-card {
			background-color: #555;
			border-left-color: #2277cc;
		}
		body.dark-mode .project-card:hover {
			background-color: #4a4a4a;
		}
		body.dark-mode .project-name {
			color: #eee;
		}
		body.dark-mode .project-model {
			color: #aaa;
		}

		/* === 暗色模式样式 === */
		body.dark_style {
			background-color: #333 !important;
			color: #eee !important;
		}
		.headbar.dark_style {
			background-color: #555 !important;
			color: #eee !important;
		}
		.title.dark_style {
			background-color: #444 !important;
			color: #eee !important;
		}
		.content.dark_style {
			background-color: #444 !important;
			color: #eee !important;
		}
		.project-card.dark_style {
			background-color: #555 !important;
			border-left-color: #2277cc !important;
		}
		.project-name.dark_style {
			color: #eee !important;
		}
		.project-model.dark_style {
			color: #aaa !important;
		}
	</style>
</head>
<body>
	<div class="page-wrap">
		<div class="headbar">
			<div>码氛 (Vibe Codes)</div>
			<div>
				<a href="../index.html">← 返回首页</a>
				<button id="dark-mode-switch" onclick="startThemeTransition()" style="background-color: #ccc; color: #222; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;"></button>
			</div>
		</div>

		<img src="人机程序员.png" alt="人机程序员" class="hero-img">

		<div class="title">
			<h1>AI 生成项目合集</h1>
			<p>这里收录了由各种 AI 模型生成的 HTML 页面，每一行代码都是人机协作的产物 🤖✨</p>
		</div>

		<div class="content" id="projectsContent">
			<div class="project-grid" id="projectList">
				<!-- JS 动态生成 -->
			</div>
		</div>
	</div>

	</body>
	<script>
		const isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1;
		const pageWrap = document.querySelector('.page-wrap');
		const darkModeSwitch = document.getElementById('dark-mode-switch');

		function walkToggle(root, isDark) {
			const all = root.querySelectorAll('*');
			for (let i = 0; i < all.length; i++) {
				all[i].classList.toggle('dark_style', isDark);
			}
			if (root.classList) {
				root.classList.toggle('dark_style', isDark);
			}
		}

		function setThemeStyles(isDark) {
			document.body.classList.toggle('dark-mode', isDark);
			walkToggle(document.body, isDark);
		}

		function updateSwitchText(isDark) {
			darkModeSwitch.textContent = isDark ? '切换到亮色模式' : '切换到暗色模式';
		}

		function setThemeStylesOnNode(root, isDark) {
			walkToggle(root, isDark);
		}

		function createTransitionOverlay(newIsDark) {
			const overlay = document.createElement('div');
			overlay.className = 'theme-transition-overlay';

			const newPanel = document.createElement('div');
			newPanel.className = 'panel';
			newPanel.style.backgroundColor = newIsDark ? '#333' : '#f0f0f0';

			const scrollX = window.scrollX || window.pageXOffset;
			const scrollY = window.scrollY || window.pageYOffset;

			const cloneWrapper = document.createElement('div');
			cloneWrapper.className = 'page-clone';
			cloneWrapper.style.position = 'absolute';
			cloneWrapper.style.top = `${-scrollY}px`;
			cloneWrapper.style.left = `${-scrollX}px`;
			cloneWrapper.style.padding = getComputedStyle(document.body).padding;
			cloneWrapper.style.width = '100%';
			cloneWrapper.style.height = '100%';
			cloneWrapper.style.boxSizing = 'border-box';

			const clone = pageWrap.cloneNode(true);
			setThemeStylesOnNode(clone, newIsDark);
			cloneWrapper.appendChild(clone);
			newPanel.appendChild(cloneWrapper);

			const scanline = document.createElement('div');
			scanline.className = 'scanline';
			newPanel.appendChild(scanline);

			overlay.appendChild(newPanel);

			return { overlay, newPanel };
		}

		function finishTransition(newIsDark, overlay) {
			setThemeStyles(newIsDark);
			updateSwitchText(newIsDark);
			overlay.remove();
			darkModeSwitch.classList.remove('spcbtn_disabled');
			darkModeSwitch.onclick = startThemeTransition;
		}

		function startThemeTransition() {
			const isDark = document.body.classList.contains('dark-mode');
			const newIsDark = !isDark;

			darkModeSwitch.classList.add('spcbtn_disabled');
			darkModeSwitch.onclick = null;

			if (isFirefox) {
				setThemeStyles(newIsDark);
				updateSwitchText(newIsDark);
				darkModeSwitch.classList.remove('spcbtn_disabled');
				darkModeSwitch.onclick = startThemeTransition;
				return;
			}

			const { overlay, newPanel } = createTransitionOverlay(newIsDark);
			document.body.appendChild(overlay);

			requestAnimationFrame(() => {
				newPanel.classList.add('active');
			});

			let finished = false;
			newPanel.addEventListener('transitionend', () => {
				if (!finished) {
					finished = true;
					finishTransition(newIsDark, overlay);
				}
			}, { once: true });

			setTimeout(() => {
				if (!finished) {
					finished = true;
					newPanel.style.clipPath = 'inset(0 0 0 0)';
					finishTransition(newIsDark, overlay);
				}
			}, 1500);
		}

		// 项目数据：从文件名解析 (模型 - 项目名.html)
		const projects = [
			{ file: 'DeepSeek - 美国象棋.html', model: 'DeepSeek', name: '美国象棋' },
			{ file: '豆包 - 游戏测试2.0.html', model: '豆包', name: '游戏测试2.0' },
			{ file: '豆包 - 游戏测试.html', model: '豆包', name: '游戏测试' },
		];

		function renderProjects() {
			const list = document.getElementById('projectList');
			list.innerHTML = projects.map(p => `
				<a href="${p.file}" class="project-card" target="_blank">
					<div class="project-info">
						<div class="project-name">${p.name}</div>
						<div class="project-model">🤖 ${p.model}</div>
					</div>
					<span class="project-link">打开 →</span>
				</a>
			`).join('');
		}

		setThemeStyles(false);
		updateSwitchText(false);
		renderProjects();
	</script>
</html>
